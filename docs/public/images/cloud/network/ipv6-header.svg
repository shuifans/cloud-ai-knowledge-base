<?xml version="1.0" encoding="UTF-8"?>
<svg width="642pt" height="502pt" version="1.1" viewBox="0 0 642 502"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     font-family="sans-serif"
     font-size="24"
     text-anchor="middle">
  <title>IPv6 Header</title>
  <defs>
    <g id="byte" stroke="black" opacity="0.5">
      <line x1="0" x2="0" y1="-10" y2="0" />
      <line x1="20" x2="20" y1="-5" y2="0" />
      <line x1="40" x2="40" y1="-5" y2="0" />
      <line x1="60" x2="60" y1="-5" y2="0" />
      <line x1="80" x2="80" y1="-10" y2="0" />
      <line x1="100" x2="100" y1="-5" y2="0" />
      <line x1="120" x2="120" y1="-5" y2="0" />
      <line x1="140" x2="140" y1="-5" y2="0" />
    </g>
    <g id="rule">
      <line x1="0" x2="640" y1="0" y2="0" stroke="black" opacity="0.5"/>
      <use xlink:href="#byte" x="0" y="0"/>
      <use xlink:href="#byte" x="160" y="0"/>
      <use xlink:href="#byte" x="320" y="0"/>
      <use xlink:href="#byte" x="480" y="0"/>
    </g>
  </defs>
	<g transform="translate(1,1)">
		<rect x="-1" y="-1" width="642" height="502" fill="#fff"/>
		<path transform="matrix(20,0,0,20,0,0)" d="m0 0.05h32v24.95h-32z" fill="#fff" stroke="#000" stroke-width=".1"/>
    <path transform="matrix(20,0,0,20,0,0)" d="m0 0h4.2125v2.5h-4.2125z" fill="#ffa5a5" fill-rule="evenodd" stroke="#000" stroke-miterlimit="10" stroke-width=".1">
      <title>Version: 4 bits</title>
    </path>
    <text x="40" y="30.167969" font-size="20">Version</text>
    <path transform="matrix(20,0,0,20,0,0)" d="m4 0h8v2.5111h-8z" fill="#ffc961" stroke="#000" stroke-width=".1">
      <title>Traffic Class: 8 bits</title>
    </path>
    <text x="160" y="32">Traffic Class</text>
    <path transform="matrix(20,0,0,20,0,0)" d="m12 0h20v2.5111h-20z" fill="#e9e9e9" stroke="#000" stroke-width=".1">
      <title>Flow Label: 20 bits</title>
    </path>
    <text x="440" y="32">Flow Label</text>
    <path transform="matrix(20,0,0,20,0,0)" d="m0 2.5h16v2.5111h-16z" fill="#59ff95" stroke="#000" stroke-width=".1">
      <title>Payload Length: 16 bits</title>
    </path>
    <text x="160" y="82">Payload Length</text>
    <path transform="matrix(20,0,0,20,0,0)" d="m16 2.5h8.2051v2.5111h-8.2051z" fill="#f1ff79" stroke="#000" stroke-width=".1">
      <title>Next Header: 8 bits</title>
    </path>
    <text x="400" y="82">Next Header</text>
    <path transform="matrix(20,0,0,20,0,0)" d="m24 2.5h8v2.5111h-8z" fill="#abd7e6" stroke="#000" stroke-width=".1">
      <title>Hop Limit: 8 bits</title>
    </path>
    <text x="560" y="82">Hop Limit</text>

    <use xlink:href="#rule" x="0" y="50" />
    <use xlink:href="#rule" x="0" y="100" />

    <path transform="matrix(20,0,0,20,0,0)" d="m0 5h32v10h-32z" fill="#a9a9ff" stroke="#000" stroke-width=".1">
      <title>Source Address: 128 bits</title>
    </path>
    <use xlink:href="#rule" x="0" y="150" />
    <use xlink:href="#rule" x="0" y="200" />
    <use xlink:href="#rule" x="0" y="250" />
    <use xlink:href="#rule" x="0" y="300" />
    <text x="320" y="206.89062" transform="translate(0,-25)">Source Address</text>
    
    <path transform="matrix(20,0,0,20,0,0)" d="m0 15h32v10h-32z" fill="#e3b7f5" stroke="#000" stroke-width=".1">
      <title>Destination Address: 128 bits</title>
    </path>
    <use xlink:href="#rule" x="0" y="350" />
    <use xlink:href="#rule" x="0" y="400" />
    <use xlink:href="#rule" x="0" y="450" />
    <use xlink:href="#rule" x="0" y="500" />
    <text x="320" y="406.89062" transform="translate(0,-25)">Destination Address</text>
	</g>
</svg>
